# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true



# ── Flyway (schema managed entirely by Flyway) ───────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=65

# ── Server ───────────────────────────────────────────────────────────────────
server.port=7070
server.servlet.context-path=/api

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=MedPlusAgreementTrackerSecretKey2026MustBeAtLeast256BitsForHS256Algorithm
jwt.expiration-ms=86400000

# ── Mail ─────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── App ───────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080,https://agreement-tracker-frontend.vercel.app
agreement.in-progress.max-days=30

